<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>展厅控制中心</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f2027">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span id="brandTitle">展厅控制中心</span></div>
    <a class="gear" href="admin.html" title="后台管理" aria-label="后台管理">⚙</a>
  </header>
  <div class="layout">
    <nav class="sidenav" id="sidenav" aria-label="屏幕导航"></nav>
    <main class="stage">
      <div class="stage-bar">
        <span class="stage-title" id="currentName">未选择</span>
        <button class="stage-open" id="openNew" type="button" title="在新窗口打开">↗ 新窗口</button>
      </div>
      <div class="frame-wrap">
        <iframe id="frame" title="屏幕内容" allow="fullscreen; autoplay; encrypted-media"></iframe>
      </div>
    </main>
  </div>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
