<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台管理 · 展厅控制中心</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f2027">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="admin-body">
  <div class="wrap">
    <div class="admin-head">
      <h1>展厅屏幕管理</h1>
      <span id="modeTag" class="mode-tag">连接中…</span>
      <a class="btn btn-ghost" href="index.html">← 返回前台</a>
    </div>

    <section class="panel">
      <h2>展厅名称</h2>
      <div class="field" style="max-width:360px">
        <label for="titleInput">前台顶部显示的标题</label>
        <input type="text" id="titleInput" placeholder="展厅控制中心">
      </div>
    </section>

    <section class="panel">
      <h2>新增 / 编辑屏幕</h2>
      <form id="editForm" autocomplete="off">
        <input type="hidden" id="fId">
        <div class="row">
          <div class="field">
            <label for="fName">屏幕名称 *</label>
            <input type="text" id="fName" placeholder="例如：数据大屏" required>
          </div>
          <div class="field">
            <label for="fIcon">图标（emoji，可选）</label>
            <input type="text" id="fIcon" placeholder="📺" maxlength="4">
          </div>
        </div>
        <div class="field">
          <label for="fUrl">链接地址 *</label>
          <input type="url" id="fUrl" placeholder="https://..." required>
        </div>
        <label class="check"><input type="checkbox" id="fEnabled" checked> 在前台显示</label>
        <div style="margin-top:14px; display:flex; gap:10px">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-ghost" id="resetBtn">清空</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>屏幕列表（↑↓ 排序）</h2>
      <table>
        <thead><tr><th>名称</th><th>链接</th><th>操作</th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </section>
  </div>
  <div class="toast" id="msg"></div>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
